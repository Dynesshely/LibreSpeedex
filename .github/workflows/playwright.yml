name: Playwright E2E

# Manual-only by design:
# - Automatic e2e runs that gate Docker image builds live in docker-publish.yml.
# - Keeping this workflow manual avoids running the same e2e suite twice on main / dev pushes.
on:
  workflow_dispatch:

jobs:
  e2e:
    # Playwright 1.59.x supports Ubuntu 22.04 / 24.04 only; ubuntu-latest now
    # resolves to 26.04, where `playwright install` refuses to install browsers.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
